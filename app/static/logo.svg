<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Solaris Grid Intelligence">
  <title>Solaris Grid Intelligence</title>
  <desc>A sun above a rising electricity demand curve that peaks in the evening.</desc>
  <defs>
    <linearGradient id="solarisBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D2747"/>
      <stop offset="100%" stop-color="#090D1A"/>
    </linearGradient>
    <linearGradient id="solarisCurve" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#5BA8FA"/>
      <stop offset="100%" stop-color="#FFB020"/>
    </linearGradient>
    <radialGradient id="solarisSun" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FFDE8A"/>
      <stop offset="100%" stop-color="#FF8A1F"/>
    </radialGradient>
  </defs>

  <!-- Badge -->
  <rect width="48" height="48" rx="13" fill="url(#solarisBadge)"/>
  <rect x="1" y="1" width="46" height="46" rx="12" fill="none"
        stroke="#FFB020" stroke-opacity="0.32" stroke-width="2"/>

  <!-- Sun: the heat that drives cooling load -->
  <circle cx="15.5" cy="15.5" r="6" fill="url(#solarisSun)"/>
  <g stroke="#FFB020" stroke-width="2.4" stroke-linecap="round">
    <line x1="15.5" y1="5" x2="15.5" y2="7"/>
    <line x1="7.6" y1="7.6" x2="9.1" y2="9.1"/>
    <line x1="5" y1="15.5" x2="7" y2="15.5"/>
  </g>

  <!-- Demand curve: overnight trough, midday dip, evening peak -->
  <path d="M6 37 C 11 37, 12.5 31.5, 18 31 C 23 30.5, 24.5 33.5, 29 30 C 33.5 26.5, 33 14.5, 38.5 14.5"
        fill="none" stroke="url(#solarisCurve)" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The evening peak hour -->
  <circle cx="38.5" cy="14.5" r="4.6" fill="#090D1A"/>
  <circle cx="38.5" cy="14.5" r="3.2" fill="#FFB020"/>
</svg>
